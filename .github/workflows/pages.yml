# Builds web/data (City) and web/data/county (County) from data/processed and publishes web/ (plus the source PDFs) to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each step runs under bash -e, so a failed build or check for either entity stops the publish.
      - name: Build and check City data
        run: |
          python scripts/build_dataset.py
          python scripts/check_dataset.py
      - name: Build and check County data
        run: |
          python scripts/build_dataset.py --entity county
          python scripts/check_dataset.py --entity county
      - name: Assemble site
        # web/pdfs is a symlink to "Budget PDFs - City", which holds a "county" symlink to "Budget PDFs - County" (pdfs/county/); -L copies the PDFs themselves.
        run: |
          mkdir _site
          cp -RL web/. _site/
      - name: Wait for deploy debounce
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          lock=".deploy-lock"
          stamp=".deploy-timestamp"
          debounce=${DEBOUNCE_SECS:-60}

          # If two pushes to main land within $debounce seconds, only the last one
          # triggers a deployment — and only after the window has cleared. GitHub
          # Pages deployments to the same environment collide and fail when
          # several runs publish at once; collapsing a burst into one publish
          # stops that. The lock/stamp files are build-local and gitignored.
          while :; do
            if mkdir "$lock" 2>/dev/null; then
              stamp_existed=0
              [[ -f "$stamp" ]] || stamp_existed=1
              last=0
              [[ -f "$stamp" ]] && last=$(cat "$stamp")
              now=$(date +%s)

              if (( stamp_existed )) && (( now - last >= debounce )); then
                echo "$now" > "$stamp"
                rmdir "$lock"
                break
              fi
              rmdir "$lock"
              sleep 10
            else
              sleep 10
            fi
          done

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
