<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lancaster Budget Explorer</title>
  <meta name="description" content="County and City of Lancaster budget information, straight from their published materials.">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Apply a saved theme before first paint so there is no flash. Storage may be blocked: then follow the device. */
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name=color-scheme]').setAttribute('content', t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231d5a3a'/%3E%3Crect x='3' y='4' width='10' height='3' rx='1.5' fill='%23fcfcfa'/%3E%3Crect x='3' y='9' width='7' height='3' rx='1.5' fill='%237fc99b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" id="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="container header-row">
      <div class="brand">
        <a class="wordmark" id="wordmark" href="#/">Lancaster Budget Explorer</a>
        <div class="entity-switch" id="entity-switch" role="group" aria-label="Budget"><a href="#/" data-entity="city">City</a><a href="#/county/" data-entity="county">County</a></div>
        <p class="tagline" id="tagline">This is an independent project, not associated with the City of Lancaster.</p>
      </div>
      <nav aria-label="Sections"><ul class="site-nav" id="site-nav">
        <li><a href="#/" data-nav="home">Overview</a></li>
        <li><a href="#/changes" data-nav="changes">What changed</a></li>
        <li><a href="#/?f=Reserve%20Fund" data-nav="reserve">Reserve Fund</a></li>
        <li><a href="#/terms" data-nav="terms">Funds and terms</a></li>
        <li><a href="#/about" data-nav="about">About the data</a></li>
      </ul></nav>
      <div class="jump-search" role="search">
        <label class="sr-only" for="jump-input">Jump to a department, bureau or line item</label>
        <input type="search" id="jump-input" role="combobox" aria-expanded="false" aria-controls="jump-list" aria-autocomplete="list" placeholder="Jump to a department or line" autocomplete="off" spellcheck="false">
        <ul id="jump-list" role="listbox" aria-label="Search results" hidden></ul>
        <p class="sr-only" id="jump-status" aria-live="polite"></p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-outline theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="ico-to-dark" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ico-to-light" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="theme-label" id="theme-label">Dark</span></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1" class="container page">
    <div id="view"><p class="muted center">Loading budget…</p></div>

    <section class="panel about" id="about" aria-labelledby="about-title" hidden>
      <h2 class="panel-title-left" id="about-title">About the data</h2>
      <div id="about-body"></div>
    </section>
    <aside class="margin" id="margin" aria-label="Reading notes"></aside>
  </main>

  <footer class="site-footer" id="site-footer" hidden>
    <div class="container">
      <p><span id="footer-text"></span> <span id="generated"></span> <span id="footer-contact"></span></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>
