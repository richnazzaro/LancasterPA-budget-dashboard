# City-of-Lancaster-Adopted-2025-Budget.yaml — one City PDF: how to read it.
# Schema: schemas/book.schema.json. Moved from config/City-of-Lancaster-Adopted-2025-Budget.json in Phase 1.2 (2026-11-28);
# the columns, page headers and totals were checked against the PDF when the book was ingested (status: reviewed).
#
# Layout of one scanned budget book, read by scripts/extract_scanned.py. Copy this file for another
# year and change what differs.
source_doc: City-of-Lancaster-Adopted-2025-Budget.pdf
layout_family: lineitem_columns
status: reviewed
document_note: Text-layer book. Budget column is headed '2025 PROPOSED'; kept as doc_type 'proposed'.
# Pages whose header matches every column below, left to right. 'header' is a regex matched against
# the column's stacked header words joined with spaces.
line_items:
  columns:
  - header: ^2023 ACTUAL$
    fiscal_year: 2023
    figure: actual
  - header: ^2024 ORIGINAL BUDGET$
    fiscal_year: 2024
    figure: adopted
  - header: ^2024 AMENDED BUDGET$
    fiscal_year: 2024
    figure: amended
  - header: ^(?:RECEIVED|EXPENDED) YTD (\d{1,2}/\d{1,2}/\d{4})$
    fiscal_year: 2024
    figure: actual_ytd
  - header: ^2024 PROJECTED$
    fiscal_year: 2024
    figure: projected
  - header: ^2025 PROPOSED$
    fiscal_year: 2025
    figure: proposed
  header_last_line: ACTUAL.*PROPOSED
  total_prefix: ^TOTAL\b\s*[-_]?\s*
  inherit_header: false
# Staffing schedule rows: org, object, title, bargaining unit, FT/PT, then one (count, salary) pair
# per column.
staffing:
  columns:
  - fiscal_year: 2025
    figure: proposed
  row:
  - title
  - count
  - salary
# Org-code prefix (first 3 digits of 8-digit codes) -> fund. 7-digit codes are General Fund.
funds:
  '560': Stormwater Management Fund
  '561': Sewer Fund
  '562': Water Fund
  '563': Solid Waste & Recycling Fund
  '662':
    fund: Long's Park Fund
    department: Public Works
  '265':
    fund: Liquid Fuels Fund
    department: Public Works
other_fund_department: Public Works      # department of a fund above given by name only (the enterprise funds)
general_fund_departments:
  '10': General Revenue
  '11': Executive
  '12': Legislative
  '13': Neighborhood Engagement
  '14': Administrative Services
  '15': Public Safety
  '16': Community Planning & Economic Development
  '18': Public Works
# Check against this book's General Fund Expense Summary.
general_fund_department_overrides:
  '1403': City Controller / Treasurer
source: text
